name: Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release and Upload Packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v20261111
          name: "AdGuard-Home-gogogo 20261111"
          body: |
            ### AdGuard-Home-gogogo `20261111`

            提供 **🌏 海外版 (Overseas)** 与 **🇨🇳 中国国内版 (CN)** 两个定制版本，均已内置最新 **AdGuard-Home-gogogo Manager v2.24.13（包名：`com.wu.adgogogo`）** 管理器应用。

            #### 🆕 20261111 更新亮点
            - **核心与规则全面升级**：
              - 升级最新 `AdGuardHome` 二进制核心（`v2026-11-07`）与最新规则集，统一采用 `nsenter -G 23333 -t 1` 进程组隔离启动，彻底根除回环自吞噬与冗余代码；
              - 修复 CN 版及升级迁移时 `AdGuardHome.yaml` 行尾注释与 BusyBox `sed` 缩进吞噬导致的启动失败问题（Issue #2）；
            - **项目品牌重塑**：
              - 项目更名为 `AdGuard-Home-gogogo`，模块名称统一为 `AdGuard Home gogogo`，作者署名为 `wu`；
              - 配套管理器包名更新为 `com.wu.adgogogo`，刷入时自动清理旧包名防止桌面重复图标。
          files: |
            releases/AdGuard_Home_gogogo_20261111_Overseas.zip
            releases/AdGuard_Home_gogogo_20261111_CN.zip
            releases/AdGuardHomeManager.apk
