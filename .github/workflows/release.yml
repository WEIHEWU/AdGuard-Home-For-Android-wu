name: Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release and Upload Packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v20261027-Beta2
          name: "AdGuard Home For Android 20261027-Beta2"
          body: |
            ### AdGuard Home For Android `20261027-Beta2`

            提供 **🌏 海外版 (Overseas)** 与 **🇨🇳 中国国内版 (CN)** 两个定制版本，均已内置最新配套的 **AdGuard Home Manager v2.24.10** 管理器应用。

            #### 🆕 20261027-Beta2 更新亮点
            - **配套管理器 `v2.24.10` 首页与模块交互极简化重构**：
              - 合并首页顶部两张卡片为单张极简主卡片：定时暂停收纳为开关左侧 `⏱️` 菜单，下方仅保留 **「误杀排错 · 应用白名单 · 网络刷新」** 三个高频按钮；
              - 移除常态下的冗余状态标签与多行说明横幅，遵循「常态隐形、异常告警」原则——仅当检测到核心未运行或 DNS/SNI 转发异常时才显示单行橙色一键修复提示。
            - **彻底解决上游 `snifilter` 拦截 HTTPS 时 App 卡死/转圈 10~30 秒问题 (`iptables.sh`)**：
              - 启用 SNI 过滤时自动将 `rp_filter` 设为 `2`（宽松模式），使 `snifilter` 伪造的 TCP RST 包不被内核丢弃，被拦截的 HTTPS 广告连接毫秒级立即断开。
            - **应用白名单升级为「内核级 UID 流量直通 + 前台感知」双引擎 (`iptables.sh`)**：
              - 在 `AGH_SNI`、`ADGUARD_DOT`、`ADGUARD`、`ADGUARD6_NAT`、`ADGUARD6` 链顶注入 `-m owner --uid-owner <uid> -j RETURN`，从内核层直接放行白名单应用的全部 DNS / DoT / SNI 流量，保存即刻热生效。
            - **限制 Go 核心内存膨胀 (`GOMEMLIMIT=65MiB`) + 固定默认端口 + 60s 规则自检自愈 (`service.sh`)**。
          files: |
            releases/AdGuard_Home_For_Android_20261027_Beta2_Overseas.zip
            releases/AdGuard_Home_For_Android_20261027_Beta2_CN.zip
            releases/AdGuardHomeManager.apk
