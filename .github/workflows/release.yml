name: Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release and Upload Packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v20261111
          name: "AdGuard-Home-gogogo 20261111"
          body: |
            ### AdGuard-Home-gogogo `20261111` (全能统一单包版)

            已将海外版与国内版合并为单一全能模块包 **`AdGuard_Home_gogogo_20261111.zip`**（**默认激活 🌐 海外模式**），并内置最新 **AdGuard-Home-gogogo Manager v2.24.14（包名：`com.wu.adgogogo`）**，支持在 App 内一键无损热切换「🌐 海外模式 (Overseas)」与「🇨🇳 国内模式 (CN)」。

            #### 🆕 20261111 更新亮点
            - **海外 / 国内双模合一与 App 内一键热切换**：
              - 告别双包分别刷入，单包内置 `AdGuardHome_overseas.yaml`（默认激活）与 `AdGuardHome_cn.yaml` 双预设及 `switch_mode.sh` 热切换引擎；
              - 在管理器首页或 DNS 设置页点击即可毫秒级热切换上游加密 DNS、规则订阅源及 VPN 伴生策略，100% 保留个人自定义规则与动态端口。
            - **核心与规则全面升级**：
              - 升级最新 `AdGuardHome` 二进制核心（`v2026-11-07`）与最新规则集，统一采用 `nsenter -G 23333 -t 1` 进程组隔离启动，彻底根除回环自吞噬与冗余代码；
              - 修复 `AdGuardHome.yaml` 行尾注释与 BusyBox `sed` 缩进吞噬导致的启动失败问题（Issue #2）。
          files: |
            releases/AdGuard_Home_gogogo_20261111.zip
            releases/AdGuardHomeManager.apk
