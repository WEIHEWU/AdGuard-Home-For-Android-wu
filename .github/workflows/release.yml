name: Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release and Upload Packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v20261018-Beta1
          name: "AdGuard Home For Android 20261018-Beta1"
          body: |
            ### AdGuard Home For Android `20261018-Beta1`

            提供 **🌏 海外版 (Overseas)** 与 **🇨🇳 中国国内版 (CN)** 两个定制版本，均已内置最新配套的 **AdGuard Home Manager v2.24.7** 管理器应用。

            #### 🆕 20261018-Beta1 更新亮点
            - **低功耗前台应用放行白名单 (`iptables.sh`)**：
              - 采用极轻量屏幕交互感应（`cmd power is-interactive`）：当手机处于息屏/口袋中时直接提前返回并重置为正常拦截，绝不打扰 CPU 深度休眠（Deep Sleep），0% 息屏功耗；
              - 亮屏状态下动态感应当前聚焦应用（`cmd activity top-activity`），若处于放行名单（`/data/adb/agh/app-allow.txt`），自动无缝暂停 DNS 过滤（`/control/protection false`），离开或息屏后毫秒级恢复；
              - 完美解决特定银行、企业内网、特定手游等敏感 App 与去广告过滤冲突的问题。
            - **15 天图表统计轻量持久化 (`datachart.txt`)**：
              - 每小时采样聚合一次 DNS 查询与拦截增量数据，零高频写盘磨损；
              - 自动维护最近 15 天时间序列数据并滚动淘汰过期数据，为管理器长期图表分析提供数据支撑。
            - **内置管理器升级至 `v2.24.7`**：
              - **应用放行名单管理**：支持从第三方应用列表智能勾选或手动输入包名，一键保存至模块放行名单；
              - **首页数据概览样式随心切换**：支持「平滑折线图」、「每小时柱状图」、「数字化概览卡片」三种样式，支持在首页与设置中自由切换；
              - **全局弹窗重构与毛玻璃遮罩**：核心操作与维护弹窗引入 8px 实时模糊背景遮罩，配合 Bouncing 阻尼回弹动效与触感反馈。
          files: |
            releases/AdGuard_Home_For_Android_20261018_Beta1_Overseas.zip
            releases/AdGuard_Home_For_Android_20261018_Beta1_CN.zip
            releases/AdGuardHomeManager.apk
