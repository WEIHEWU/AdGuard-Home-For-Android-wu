name: Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release and Upload Packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v20261016-Beta1
          name: "AdGuard Home For Android (wu修改版) 20261016-Beta1"
          body: |
            ### AdGuard Home For Android (wu修改版) `20261016-Beta1`

            提供 **🌏 海外版 (Overseas)** 与 **🇨🇳 中国国内版 (CN)** 两个定制版本，均已内置配套的 **AdGuard Home Manager (wu修改版) v2.24.4** 管理器应用。

            #### 🆕 20261016-Beta1 更新亮点
            - **修复 Google 广告侧漏 Bug，重回 100% 拦截率**：彻底移除过度放行的 `@@||google.com^$important` 整域通配规则，改为精确放行 GMS/Play 核心接口（`play.google.com`、`accounts.google.com` 等），彻底消灭 `ads.google.com` 与 `adservice.google.com` 广告漏网；
            - **同步上游最新 `v2026-10-15` 核心二进制**：升级内核至包含 PR #18（修复 NFQUEUE 异常断连后的事件驱动自动重连机制，防止 SNI 队列意外退出）；
            - **内置管理器升级至 `v2.24.4 (wu修改版)`**：修复新版 AdGuard Home 加密设置报错、适配 Android 16/17+ 本地网络权限、新增应用内多语言切换支持。
          files: |
            releases/AdGuard_Home_For_Android_20261016_Beta1_Overseas_wu修改版.zip
            releases/AdGuard_Home_For_Android_20261016_Beta1_CN_wu修改版.zip
            releases/AdGuardHomeManager_wu修改版.apk
